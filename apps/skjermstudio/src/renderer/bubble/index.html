<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
  <title>Kameraboble</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    .boble {
      position: absolute; inset: 4px; border-radius: 50%; overflow: hidden;
      background: #000; border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      -webkit-app-region: drag; cursor: grab;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
    .ring { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      box-shadow: inset 0 0 0 3px rgba(255, 77, 90, 0); transition: box-shadow 0.3s ease; }
    .ring.tar-opp { box-shadow: inset 0 0 0 3px rgba(255, 77, 90, 0.95); }
    .hjelp {
      position: absolute; bottom: -2px; left: 50%; transform: translate(-50%, 100%);
      white-space: nowrap; font-size: 10px; color: #cbd3e1;
      background: rgba(16, 18, 22, 0.9); padding: 3px 9px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12); pointer-events: none;
      opacity: 0; transition: opacity 0.2s ease;
    }
    body:hover .hjelp { opacity: 1; }
  </style>
</head>
<body>
  <div class="boble" id="boble">
    <video id="video" autoplay muted playsinline></video>
    <div class="ring" id="ring"></div>
  </div>
  <div class="hjelp">Dra for å flytte · rull for å endre størrelse</div>
  <script type="module" src="boble.js"></script>
</body>
</html>
